name: Remote Attestation

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "Internet Archive 备份"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run attestation
        env:
          SITE_URL: https://seed-trilogy.com.cn
        run: |
          ARGS=""
          if [ "${{ inputs.archive }}" = "true" ]; then ARGS="$ARGS --archive"; fi
          python3 scripts/attest.py $ARGS
