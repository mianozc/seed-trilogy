name: Remote Attestation

on:
  workflow_dispatch:
    inputs:
      ipfs:
        description: "IPFS 远程固定（Pinata）"
        type: boolean
        default: true
      arweave:
        description: "Arweave 永久存储"
        type: boolean
        default: false
      archive:
        description: "Internet Archive 备份"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arweave-python-client 2>/dev/null || true

      - name: Run attestation
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          ARWEAVE_WALLET: ${{ secrets.ARWEAVE_WALLET }}
          SITE_URL: https://seed-trilogy.com.cn
        run: |
          ARGS=""
          if [ "${{ inputs.ipfs }}" = "true" ]; then ARGS="$ARGS --ipfs"; fi
          if [ "${{ inputs.arweave }}" = "true" ]; then ARGS="$ARGS --arweave"; fi
          if [ "${{ inputs.archive }}" = "true" ]; then ARGS="$ARGS --archive"; fi
          python3 scripts/attest.py $ARGS
