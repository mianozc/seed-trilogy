# 《种子》三部曲 · 自动部署
# 推送到 main 分支时：构建 → 部署到 Cloudflare Pages（国际）+ Gitee Pages（国内）
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: npm run build

      # ====== Cloudflare Pages（国际访问） ======
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=seed-trilogy

      # ====== Gitee Pages（国内访问） ======
      - name: Deploy to Gitee Pages
        uses: yanglbme/gitee-pages-action@main
        with:
          gitee-username: miao-zhichun
          gitee-repo: seed-trilogy
          gitee-token: ${{ secrets.GITEE_TOKEN }}
          directory: dist

