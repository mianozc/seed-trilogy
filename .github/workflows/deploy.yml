# 《种子》三部曲 · 自动部署
# 推送到 main 分支时：构建 → 部署到 Cloudflare Pages（国际）+ Gitee Pages（国内）
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: npm run build

      # ====== Cloudflare Pages（国际访问） ======
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=seed-trilogy

      # ====== Gitee Pages（国内访问） ======
      - name: Deploy to Gitee Pages
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd dist
          git init
          git checkout -b pages
          git config user.name "miao-zhichun"
          git config user.email "miao-zhichun@users.noreply.gitee.com"
          git add -A
          git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://miao-zhichun:${GITEE_TOKEN}@gitee.com/miao-zhichun/seed-trilogy.git" pages:pages
          # 触发 Gitee Pages 重新构建
          curl -s -X POST "https://gitee.com/api/v5/repos/miao-zhichun/seed-trilogy/pages/builds" \
            -d "access_token=${GITEE_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded"
          echo "Gitee Pages deployed ✓"

